name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm run build
      - name: Tag a commit that holds the built package
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo "$tag already exists. Bump version in package.json first."
            exit 1
          fi
          npm pkg delete scripts devDependencies
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist package.json
          git commit -m "Release $tag"
          git tag "$tag"
          git push origin "refs/tags/$tag"
